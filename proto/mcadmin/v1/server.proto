// Minecraft サーバーの状態取得と起動・停止。
syntax = "proto3";

package mcadmin.v1;

import "google/protobuf/timestamp.proto";
import "mcadmin/v1/common.proto";
import "mcadmin/v1/operation.proto";

option go_package = "github.com/kkito0726/minecraft-server/backend/gen/mcadmin/v1;mcadminv1";

service ServerService {
  // GetStatus はコンテナとサーバーの現在の状態を返す（REQ-001）。
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {}
  // GetConfig は .env の設定のうち、公開を許可したキーだけを返す。
  //
  // RCON_PASSWORD / ADMIN_TOKEN、および server.properties の rcon.password と
  // management-server-secret は絶対に含めない（REQ-403）。
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {}
  rpc StartServer(StartServerRequest) returns (StartServerResponse) {}
  rpc StopServer(StopServerRequest) returns (StopServerResponse) {}
  rpc RestartServer(RestartServerRequest) returns (RestartServerResponse) {}
  // GetGameSettings は .env のゲーム設定（難易度・MOTD・人数・距離）を返す。
  //
  // 読めない値があっても失敗させず、既定値で補って warnings で伝える。
  // 失敗させると、設定を直すための画面そのものが開けなくなる。
  rpc GetGameSettings(GetGameSettingsRequest) returns (GetGameSettingsResponse) {}
  // UpdateGameSettings はゲーム設定を .env に書く。
  //
  // apply_now が真でサーバーが稼働中なら、書いたうえでコンテナを作り直して
  // 反映する（接続中の人は切断される）。停止中は書くだけで、勝手に起動しない。
  // バージョン・サーバー種別・メモリはこの RPC では変えられない。
  rpc UpdateGameSettings(UpdateGameSettingsRequest) returns (UpdateGameSettingsResponse) {}
}

// ContainerState は docker compose ps から読んだコンテナの状態。
enum ContainerState {
  CONTAINER_STATE_UNSPECIFIED = 0;
  CONTAINER_STATE_RUNNING = 1;
  CONTAINER_STATE_EXITED = 2;
  CONTAINER_STATE_RESTARTING = 3;
  // コンテナ自体が存在しない（docker compose down 済み）。
  CONTAINER_STATE_MISSING = 4;
}

// SavingState はワールドの保存が有効かどうかの推定値。
//
// RCON には保存状態を問い合わせる手段がないため実測できない。
// save-on が冪等であることを利用して無条件に再送する設計であり、
// ここに出るのはあくまで推定である（REQ-105、REQ-106）。
enum SavingState {
  SAVING_STATE_UNSPECIFIED = 0;
  // 通常。保存は有効と推定される。
  SAVING_STATE_ASSUMED_ON = 1;
  // 中断された操作が検出されており、save-off が残っている可能性がある。
  SAVING_STATE_SUSPECT_OFF = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
  ContainerState container_state = 1;
  // イメージ同梱のヘルスチェックの結果。
  bool healthy = 2;
  google.protobuf.Timestamp container_started_at = 3;
  // .env の MC_VERSION。
  string configured_version = 4;
  // .env の MC_LEVEL。
  string active_level = 5;
  // 稼働中ワールドの level.dat から読んだバージョン。
  WorldVersion active_world_version = 6;
  // list コマンドの出力を解釈できなかった場合は -1（EDGE-002）。
  int32 online_players = 7;
  int32 max_players = 8;
  SavingState saving_state = 9;
  // 前回の実行が操作の途中で終了した形跡がある（REQ-107）。
  bool interrupted_operation_detected = 10;
  // 進行中の操作。無ければ未設定。
  Operation active_operation = 11;
}

message GetConfigRequest {}

message GetConfigResponse {
  // 公開を許可したキーのみ。
  map<string, string> values = 1;
}

message StartServerRequest {}

message StartServerResponse {
  Operation operation = 1;
}

message StopServerRequest {}

message StopServerResponse {
  Operation operation = 1;
}

message RestartServerRequest {}

message RestartServerResponse {
  Operation operation = 1;
}

// Difficulty は難易度。server.properties の difficulty に対応する。
enum Difficulty {
  DIFFICULTY_UNSPECIFIED = 0;
  DIFFICULTY_PEACEFUL = 1;
  DIFFICULTY_EASY = 2;
  DIFFICULTY_NORMAL = 3;
  DIFFICULTY_HARD = 4;
}

// GameSettings は管理画面から書き換えてよいゲーム設定。
//
// 欄を足すときは慎重に。MC_VERSION は片道のアップグレードを、MC_MEMORY は
// Pi が固まる状態を、画面のひと押しで起こせるようになる。
message GameSettings {
  Difficulty difficulty = 1;
  // サーバー一覧に出る説明文。§ の色コードは使えるが、" $ ` \ と改行は使えない。
  string motd = 2;
  int32 max_players = 3;
  // 描画距離（チャンク）。3〜32。
  int32 view_distance = 4;
  // シミュレーション距離（チャンク）。3〜32、かつ描画距離以下。
  int32 simulation_distance = 5;
}

message GetGameSettingsRequest {}

message GetGameSettingsResponse {
  GameSettings settings = 1;
  // .env に読めない値があったときの説明。既定値で補って表示していることを伝える。
  repeated string warnings = 2;
}

message UpdateGameSettingsRequest {
  GameSettings settings = 1;
  // 真なら、稼働中のサーバーを作り直して今すぐ反映する。
  bool apply_now = 2;
}

message UpdateGameSettingsResponse {
  // 書き込んだ設定。
  GameSettings settings = 1;
  // apply_now が真で、サーバーが稼働中だったときだけ設定される。
  Operation operation = 2;
}
