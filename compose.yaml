# Minecraft server (Paper) — すべてコンテナ内で完結。
# ホストに Java / mcrcon / mc-monitor などを入れる必要はありません。
#
# 想定構成: Raspberry Pi 5 (4GB) でサーバーを動かし、Tailscale 経由で接続する。
# Pi 固有の準備（SSD 起動・スワップ無効化・Tailscale）は docs/raspberry-pi.md を参照。
#
#   起動      : docker compose up -d
#   コンソール: docker compose logs -f mc
#   コマンド  : docker compose exec mc rcon-cli list
#   停止      : docker compose down
#   設定変更  : .env を編集して docker compose up -d（MC_VERSION もここ）
#   OP 付与   : .env の MC_OPS に Minecraft ID を書いて docker compose up -d
services:
  mc:
    # itzg/minecraft-server は MC のバージョンに合った JDK を同梱している。
    # linux/arm64 のマニフェストがあるので Pi 5 でもそのまま動く。
    # 再現性を優先するならタグを日付付き（例 :2026.8.0-java21）に固定する。
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    # サーバーコンソールに docker attach で入れるようにする
    stdin_open: true
    tty: true
    # docker stop のデフォルト猶予は 10 秒で、ワールドの保存が間に合わずに
    # SIGKILL されることがある。停電・再起動時のチャンク破損を避けるため延長する。
    stop_grace_period: 60s
    # ログが SD カード / SSD を圧迫しないよう上限を設ける
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # JVM は -Xmx を明示指定されると cgroup の上限を見ないため、ここを超えると
    # GC ではなくコンテナごと OOM kill される。Pi でスワップに落ちて数秒固まるより
    # 落ちて restart した方がマシ、というトレードオフで入れている。
    # MEMORY(ヒープ) + メタスペース + GC 構造体 + Netty のダイレクトバッファで
    # 実 RSS はヒープの 1.3〜1.4 倍になるため、MEMORY=2G なら 3g が目安。
    mem_limit: "${MC_MEM_LIMIT:-3g}"
    ports:
      # Minecraft 本体のみ公開。RCON(25575) は公開せずコンテナ内からのみ使う。
      # 0.0.0.0 で待つので Tailscale の tailscale0 側からもそのまま届く。
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "${MC_TYPE:-PAPER}"
      # LATEST は使わない。コンテナ再作成で勝手にバージョンが上がり、
      # ワールドの片道アップグレードとクライアント不整合を起こすため。
      VERSION: "${MC_VERSION:?MC_VERSION is not set. see .env}"
      # Pi 5 (4GB) 想定。MEMORY は -Xms と -Xmx の両方に効く。
      # OS に 600MB 程度残す必要があるので 2G より上げないこと。
      MEMORY: "${MC_MEMORY:-2G}"
      # Aikar のフラグは 10GB 級のヒープ向けのチューニングで、
      # G1NewSizePercent=30 などが 2G ヒープでは old 世代を圧迫して GC 頻度を上げる。
      # GC の停止はそのまま「moved too quickly」による巻き戻りにつながるため既定は FALSE。
      # ヒープを 6G 以上取れる環境では TRUE にする価値がある。
      USE_AIKAR_FLAGS: "${MC_AIKAR_FLAGS:-FALSE}"
      TZ: "${TZ:-Asia/Tokyo}"
      MOTD: "${MC_MOTD:-A Minecraft Server on Docker}"
      DIFFICULTY: "${MC_DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-5}"
      # 距離設定はプレイヤー1人あたりの CPU コストを最も左右する。
      # simulation は エンティティ・レッドストーンの処理範囲で view より重い。
      VIEW_DISTANCE: "${MC_VIEW_DISTANCE:-7}"
      SIMULATION_DISTANCE: "${MC_SIMULATION_DISTANCE:-5}"
      # 同一 LAN 内の直結が確認できている場合のみ -1（圧縮無効）にする価値がある。
      # Tailscale は経路が LAN 直結とは限らず、Pi の CPU よりも帯域の方が
      # ボトルネックになりやすいため既定では圧縮を有効のままにする。
      NETWORK_COMPRESSION_THRESHOLD: "${MC_NETWORK_COMPRESSION_THRESHOLD:-256}"
      ONLINE_MODE: "${MC_ONLINE_MODE:-TRUE}"
      # OP にしたい Minecraft ID をカンマ区切りで .env に書く
      OPS: "${MC_OPS:-}"
      # 参加を許可する Minecraft ID をカンマ区切りで指定。
      # 空でない値を入れると white-list / enforce-whitelist が自動で TRUE になる。
      WHITELIST: "${MC_WHITELIST:-}"
      # 明示的に FALSE を渡さないと、一度有効化した white-list が
      # MC_WHITELIST を空に戻しても true のまま残る（= 誰も入れなくなる）。
      # MC_WHITELIST が空でない場合はイメージ側が TRUE で上書きするので競合しない。
      ENABLE_WHITELIST: "${MC_ENABLE_WHITELIST:-FALSE}"
      ENFORCE_WHITELIST: "${MC_ENABLE_WHITELIST:-FALSE}"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD:?RCON_PASSWORD is not set. see .env}"
      # 設定の正は .env / compose 側。起動のたびに server.properties を上書きする
      # （= data/server.properties を手で書き換えても再起動で戻る。設定変更は .env で行う）
      OVERRIDE_SERVER_PROPERTIES: "TRUE"
    volumes:
      # ワールド・プラグイン・ログ・ops.json をホストから直接扱えるようにする
      # （server.properties だけは上記 OVERRIDE により毎回再生成される）
      - ./data:/data
