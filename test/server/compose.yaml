# 結合テスト用の Minecraft サーバー。
#
# 本番（リポジトリ直下の compose.yaml）とは別プロジェクト・別ポート・別データで
# 動く。data/world を一度も触らずに、取得 → 復元 → 切替の一往復を通すための環境。
#
#   起動  : make test-env-up      （管理コンソールごと立ち上がる）
#   停止  : make test-env-down
#   破棄  : make test-env-clean    （ワールドとバックアップごと消す）
#
# **管理コンソール（mcadmind）は別のプロジェクトに置いてある**（test/compose.yaml）。
# 同じプロジェクトに入れると、mcadmind が復元や COLD 取得で実行する
# `docker compose down` が**自分自身を巻き込んで落とす**。down はサービス単位では
# なくプロジェクト単位で効くため。操作の途中でプロセスが消えるので、ロックが
# 残り、ワールドは退避されたまま戻らない。
#
# 本番でも mcadmind はこのプロジェクトの外（systemd 配下）にいる。同じ形。

# 本番と同じ名前にすると、テストの down が本番のコンテナを巻き込む。必ず分ける。
# mcadmind はこの名前を compose.yaml の name: から読む。
name: minecraft-server-test

services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server-test
    # テスト環境は落ちたままにする。勝手に上がると失敗の原因が隠れる。
    restart: "no"
    stdin_open: true
    tty: true
    # 本番は 60 秒。テストでは待ち時間を削る（壊れて困るワールドが無い）。
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    mem_limit: "${MC_MEM_LIMIT:-2g}"
    ports:
      # 本番の 25565 とぶつけない。両方を同時に立てられるようにしておく。
      - "${MC_PORT:-25566}:25565"
    environment:
      EULA: "TRUE"
      TYPE: "${MC_TYPE:-PAPER}"
      VERSION: "${MC_VERSION:?MC_VERSION is not set. see test/.env}"
      LEVEL: "${MC_LEVEL:-world}"
      SEED: "${MC_SEED:-}"
      # 生成を速くする。結合テストが見たいのは地形ではなく、
      # 保存 → 固める → 展開 → 起動の一往復なので、平坦で十分。
      LEVEL_TYPE: "${MC_LEVEL_TYPE:-flat}"
      MEMORY: "${MC_MEMORY:-1G}"
      USE_AIKAR_FLAGS: "FALSE"
      TZ: "${TZ:-Asia/Tokyo}"
      MOTD: "${MC_MOTD:-integration test}"
      DIFFICULTY: "${MC_DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-5}"
      # 起動を速くするため本番より小さくする。
      VIEW_DISTANCE: "${MC_VIEW_DISTANCE:-4}"
      SIMULATION_DISTANCE: "${MC_SIMULATION_DISTANCE:-4}"
      # 誰も繋がないので認証を切る。オフラインでも起動できるようにするため。
      ONLINE_MODE: "${MC_ONLINE_MODE:-FALSE}"
      OPS: "${MC_OPS:-}"
      WHITELIST: ""
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      # RCON は本番と同じく公開しない。save-off / save-all / save-on に要る。
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD:?RCON_PASSWORD is not set. see test/.env}"
      OVERRIDE_SERVER_PROPERTIES: "TRUE"
    volumes:
      # test/data/ に閉じる。本番の data/ には一切触らない。
      - ./data:/data
